    <!-- ===== 详情渲染 + 评论初始化 ===== -->
    <script>
        (function () {
            var BD = window.BD || {};
            function esc(s) {
                return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }
            // 与 site.js 中 buildSummary 保持一致（本地独立副本，确保 Supabase 不可用时内容仍可渲染）
            function buildSummary(n) {
                var parts = [];
                var lic = (n.licenser || '').trim();
                var lee = (n.licensee || '').trim();
                var parties = [lic, lee].filter(Boolean).join(' 与 ');
                var deal = n.coop || '交易';
                var head;
                if (parties) {
                    head = (n.date ? n.date + '，' : '') + parties + ' 就 ' + deal + '达成合作';
                } else {
                    head = (n.date ? n.date + '，' : '') + '一笔 ' + deal + '交易完成';
                }
                parts.push(head + '。');
                var sub = [n.productType, n.indication].filter(Boolean).map(function (s) { return s.trim(); }).join('、');
                if (n.product) {
                    parts.push('交易标的为 ' + n.product + (sub ? '（' + sub + '）' : '') + '。');
                }
                if (n.stage) parts.push('项目当前处于 ' + n.stage + ' 阶段。');
                var moneyBits = [];
                if (n.upfront) moneyBits.push('首付款 ' + n.upfront + (n.upfrontType ? '（' + n.upfrontType + '）' : ''));
                if (n.totalValue) moneyBits.push('潜在总交易额 ' + n.totalValue);
                if (moneyBits.length) parts.push(moneyBits.join('，') + '。');
                if (n.territory) parts.push('合作地域覆盖 ' + n.territory + '。');
                if (n.notes && n.notes.trim()) parts.push(n.notes.trim());
                return parts.join('');
            }
            var CAT_BADGE = BD.CAT_BADGE || { '肿瘤': 'bg-navy-50 text-navy-600', '自免': 'bg-emerald-50 text-emerald-600', '代谢': 'bg-amber-50 text-amber-600' };

            function getParam(name) {
                var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
                return m ? decodeURIComponent(m[1]) : null;
            }
            var id = getParam('id');
            var NEWS = window.NEWS_DATA || [];
            var n = NEWS.filter(function (x) { return String(x.id) === String(id); })[0];
            var contentEl = document.getElementById('detailContent');

            if (!n) {
                contentEl.innerHTML = '<div class="text-center py-16"><p class="text-gray-400">未找到该交易动态。</p><a href="news.html" class="mt-4 inline-block text-navy-600 font-semibold">← 返回交易动态</a></div>';
                return;
            }

            var badge = CAT_BADGE[n.category] || 'bg-navy-50 text-navy-600';
            var chips = [];
            if (n.licenser || n.licensee) chips.push([n.licenser, n.licensee].filter(Boolean).join(' → '));
            if (n.stage) chips.push(n.stage);
            if (n.productType) chips.push(n.productType);
            if (n.indication) chips.push(n.indication);
            contentEl.innerHTML =
                '<div class="flex items-center gap-2 mb-3">' +
                    '<span class="px-2 py-0.5 rounded text-xs font-medium ' + badge + '">' + esc(n.category) + '</span>' +
                    '<span class="text-xs text-gray-400">' + esc(n.date || '') + '</span>' +
                '</div>' +
                '<h1 class="text-2xl sm:text-3xl font-bold text-navy-800 leading-snug">' + esc(n.product || '未披露产品') + '</h1>' +
                (chips.length ? '<div class="mt-3 flex flex-wrap gap-2">' + chips.map(function (c) { return '<span class="px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs">' + esc(c) + '</span>'; }).join('') + '</div>' : '') +
                '<p class="mt-5 text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">' + esc((BD.buildSummary ? BD.buildSummary(n) : buildSummary(n)) || '暂无内容摘要。') + '</p>';

            // 相关链接
            var linksEl = document.getElementById('detailLinks');
            if (linksEl) {
                function row(label, url) {
                    if (url) {
                        return '<a href="' + esc(url) + '" target="_blank" rel="noopener" class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl border border-gray-200 hover:border-navy-300 hover:bg-navy-50/50 transition-colors group">' +
                            '<span class="text-sm text-gray-600">' + esc(label) + '</span>' +
                            '<span class="inline-flex items-center gap-1 text-sm font-medium text-navy-600 group-hover:underline">打开 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></span>' +
                            '</a>';
                    }
                    return '<div class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl border border-dashed border-gray-200">' +
                        '<span class="text-sm text-gray-500">' + esc(label) + '</span>' +
                        '<span class="text-xs text-gray-300">待补充</span>' +
                        '</div>';
                }
                var rows = '';
                rows += row('原文出处', n.source);
                rows += row('授权方 PR 稿件', n.licenserPr);
                rows += row('引进方 PR 稿件', n.licenseePr);
                rows += row('交易所公告', n.exchange);
                linksEl.innerHTML = rows;
            }

            // 评论 / 论坛
            if (window.BD && window.BD.initComments) window.BD.initComments(String(n.id));
        })();
    </script>
