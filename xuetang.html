<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学堂 — BD之家</title>
    <meta name="description" content="BD之家 · 学堂，BD 实战知识与课程筹备中">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#eef2f8',
                            100: '#d4dded',
                            200: '#a9bbdb',
                            300: '#7e99c9',
                            400: '#5377b7',
                            500: '#3b5d9a',
                            600: '#1e3a5f',
                            700: '#162c47',
                            800: '#0e1e30',
                            900: '#070f18',
                        }
                    },
                    fontFamily: {
                        sans: ['"Inter"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .glass-nav { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .fade-up { opacity: 0; transform: translateY(24px); transition: all 0.6s ease-out; }
        .fade-up.visible { opacity: 1; transform: translateY(0); }
        .card-hover { transition: all 0.25s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(30,58,95,0.10); }
        .accent-line { width: 44px; height: 3px; background: linear-gradient(90deg, #3b5d9a, #7e99c9); border-radius: 2px; }
        .input-focus:focus { border-color: #3b5d9a; box-shadow: 0 0 0 3px rgba(59,93,154,0.12); outline: none; }
        .empty-box { border: 2px dashed #cbd5e1; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .modal-card { animation: modalIn 0.25s ease-out; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased bg-white">

    <!-- ===== NAVIGATION ===== -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 glass-nav bg-white/85 border-b border-gray-100 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <a href="index.html" class="flex items-center gap-2.5 shrink-0">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-navy-500 to-navy-700 flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                        </svg>
                    </div>
                    <span class="text-lg font-bold text-navy-700 tracking-tight">BD之家</span>
                </a>

                <!-- Desktop Links -->
                <div class="hidden md:flex items-center gap-6 text-sm font-medium">
                    <a href="index.html" class="text-gray-500 hover:text-navy-700 transition-colors">首页</a>
                    <a href="news.html" class="text-gray-500 hover:text-navy-700 transition-colors">新闻</a>
                    <a href="xuetang.html" class="text-navy-600 hover:text-navy-800 transition-colors">学堂</a>
                    <a href="tools.html" class="text-gray-500 hover:text-navy-700 transition-colors">工具</a>

                    <!-- 登录态显示区（默认隐藏） -->
                    <div id="userArea" class="hidden flex items-center gap-3 pl-2 border-l border-gray-200">
                        <span class="flex items-center gap-1.5 text-navy-700">
                            <svg class="w-4 h-4 text-navy-500" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <span id="userName" class="font-medium"></span>
                        </span>
                        <button id="logoutBtn" class="text-gray-400 hover:text-navy-700 transition-colors">退出</button>
                    </div>

                    <!-- 未登录显示区 -->
                    <button id="loginBtn" class="px-4 py-2 bg-navy-600 text-white rounded-lg hover:bg-navy-700 transition-all text-sm">登录</button>
                    <button id="registerBtn" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-all text-sm">注册</button>
                </div>

                <!-- Mobile Burger -->
                <button id="menuBtn" class="md:hidden p-2 rounded-lg hover:bg-navy-50 transition-colors" aria-label="菜单">
                    <svg id="menuIcon" class="w-6 h-6 text-navy-700" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>

            <!-- Mobile Menu -->
            <div id="mobileMenu" class="md:hidden hidden pb-4 flex flex-col gap-2 text-sm font-medium">
                <a href="index.html" class="block px-3 py-2 rounded-lg text-gray-600 hover:bg-navy-50 transition-colors mobile-link">首页</a>
                <a href="news.html" class="block px-3 py-2 rounded-lg text-gray-600 hover:bg-navy-50 transition-colors mobile-link">新闻</a>
                <a href="xuetang.html" class="block px-3 py-2 rounded-lg text-navy-600 bg-navy-50 transition-colors mobile-link">学堂</a>
                <a href="tools.html" class="block px-3 py-2 rounded-lg text-gray-600 hover:bg-navy-50 transition-colors mobile-link">工具</a>
                <button id="mobileLogin" class="block px-3 py-2 rounded-lg bg-navy-600 text-white text-center hover:bg-navy-700 transition-colors mobile-link">登录</button>
                <button id="mobileRegister" class="block px-3 py-2 rounded-lg bg-emerald-600 text-white text-center hover:bg-emerald-700 transition-colors mobile-link">注册</button>
                <div id="mobileUser" class="hidden px-3 py-2 rounded-lg bg-navy-50 text-navy-700 flex items-center justify-between mobile-link">
                    <span>已登录：<span id="mobileUserName" class="font-medium"></span></span>
                    <button id="mobileLogout" class="text-navy-500 underline">退出</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== 学堂 (占位) ===== -->
    <section class="pt-28 pb-16 sm:pt-32 sm:pb-20 bg-gray-50 scroll-mt-16">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center fade-up mb-10">
                <span class="text-xs font-semibold text-navy-500 uppercase tracking-widest">Academy</span>
                <h2 class="text-2xl sm:text-3xl font-bold text-navy-800 mt-2">学堂</h2>
                <div class="accent-line mx-auto mt-3"></div>
            </div>
            <div class="fade-up empty-box rounded-2xl py-16 text-center bg-white">
                <svg class="w-12 h-12 text-gray-300 mx-auto mb-4" width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
                <p class="text-gray-400 text-sm">内容筹备中，敬请期待</p>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="bg-navy-900 py-8 border-t border-navy-700/30">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-navy-500 to-navy-700 flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                </div>
                <span class="text-navy-300 text-sm">BD之家</span>
            </div>
            <p class="text-navy-400 text-xs">&copy; 2026 BD之家. All rights reserved.</p>
        </div>
    </footer>

    <!-- ===== AUTH MODAL ===== -->
    <div id="authModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="modal-card w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <h3 class="text-lg font-bold text-navy-800">账户</h3>
                <button id="authModalClose" class="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400 transition-colors" aria-label="关闭">
                    <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Tabs -->
            <div class="flex px-6 pt-4 gap-6 border-b border-gray-100">
                <button data-tab="login" class="pb-3 text-sm font-semibold text-navy-700 border-b-2 border-navy-600 -mb-px transition-colors">登录</button>
                <button data-tab="register" class="pb-3 text-sm font-medium text-gray-400 border-b-2 border-transparent transition-colors">注册</button>
            </div>

            <!-- 登录 -->
            <form id="loginForm" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">邮箱</label>
                    <input id="loginId" type="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm input-focus transition-all"
                        placeholder="请输入注册邮箱">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
                    <input id="loginPwd" type="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm input-focus transition-all"
                        placeholder="请输入密码">
                </div>
                <button type="submit" class="w-full px-6 py-3 bg-navy-600 text-white font-semibold rounded-xl hover:bg-navy-700 transition-all active:scale-[0.98]">登录</button>
                <p class="text-xs text-gray-400 text-center">注册即表示同意服务条款</p>
            </form>

            <!-- 注册 -->
            <form id="registerForm" class="p-6 space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">邮箱</label>
                    <input id="regEmail" type="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm input-focus transition-all"
                        placeholder="your@company.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
                    <input id="regPwd" type="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm input-focus transition-all"
                        placeholder="至少 6 位">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">确认密码</label>
                    <input id="regPwd2" type="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl text-sm input-focus transition-all"
                        placeholder="再次输入密码">
                </div>
                <button type="submit" class="w-full px-6 py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition-all active:scale-[0.98]">注册并登录</button>
            </form>
        </div>
    </div>

    <!-- ===== SHARED SCRIPT ===== -->
    <script src="site.js"></script>
</body>
</html>
